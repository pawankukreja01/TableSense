services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tablesense
      POSTGRES_USER: tablesense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-db}
    volumes:
      - pilot-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U tablesense"]
      interval: 4s
      timeout: 3s
      retries: 15
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-db}
      SECRET_KEY: ${SECRET_KEY:-local-development-only}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DEMO_MODE: ${DEMO_MODE:-1}
      PRODUCTION: ${PRODUCTION:-0}
      TRUST_HTTPS_PROXY: ${TRUST_HTTPS_PROXY:-0}
      ENABLE_PROMOTIONS: ${ENABLE_PROMOTIONS:-0}
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 4s
      retries: 5
volumes:
  pilot-data:
